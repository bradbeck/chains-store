apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/tektoncd/pipeline/releases/download/v0.62.9/release.yaml
patches:
- target:
    kind: ConfigMap
    name: feature-flags
  patch: |-
    - op: replace
      path: /data/enable-api-fields
      value: alpha
